[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-detection"
version = "0.1.0"
description = "Research prototype for quality-aware stress pattern estimation"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
inspection = ["av"]
face-quality = ["av==19.0.2", "mediapipe==1.2.2", "numpy==2.5.4", "opencv-contrib-python==5.0.0.93"]

baseline = ["numpy==2.5.4", "scikit-learn==1.9.1", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]
